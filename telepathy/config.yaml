# Settings for the loop (loop.py). One model reads a task prompt, writes an llm_program that runs
# inside its own prompt pass, and attempts the task with it.

models:
  qwen3-8b-4bit: mlx-community/Qwen3-8B-4bit
model: qwen3-8b-4bit

task:                        # the task (tasks/<name>/task.py)
  name: lean
  split: Valid
  sample: 20                 # problems, taken one at a time (0: all)
  seed: 2

read:                        # step 0 (instructions/read.py)
  layers: [0, 6, 12, 18, 24, 30, 35]
  candidates: 8              # candidate read instructions per layer, per problem

cache:                       # steps 1 and 5 (instructions/cache.py)
  match: 0.5                 # |cosine| at which a candidate is the same as a cached instruction
  persist: 3                 # an instruction that came back this many times is kept for good
  patience: 5                # problems an instruction may go without coming back before it is discarded

write:                       # steps 2 and 3 (programs/write.py, programs/trace.py)
  rounds: 2                  # write, trace, write again
  show: 12                   # read instructions shown to the model
  max_tokens: 700
  temperature: 0.7
  think: false

check:                       # step 4 (loop.py)
  retries: 3                 # after a failed check, edit the program and check again; the best is kept

attempt:                     # step 4 (the task's attempt)
  rounds: 4                  # write a proof, repair from the judge's errors
  think_tokens: 1000
  max_tokens: 768
  temperature: 0.6
  repetition_penalty: 1.05

prompts:                     # the loop's texts; none of them is about the task. {name} is filled in
  write: |-
    You are a language model. You will soon read a task prompt and reply to it. Before you do, write
    a short Python program that runs inside you while you read that prompt. The goal is for your
    reply to succeed more often.

    The end of the prompt, as you will read it, is these tokens (position:text). Positions {first}
    to {last} are the task's own part; you start your reply after position {last}:
    {tokens}

    Read instructions are directions in your internal state, found in how you read earlier tasks.
    Each sits at one layer (0 to {layers} - 1). On this prompt they do this:
    {instructions}

    Your program gets:
      tokens            tokens[pos] is the text of the token at position pos
      first, last       the positions above
      instructions      the names of the read instructions
      layer_of(name)    the layer of a read instruction
      read(name, pos)   the value of a read instruction at position pos: 0 is typical, +2 or -2 unusual
      write(name, pos, amount)
                        change your state at pos, at the instruction's layer, so that its value there
                        goes up by amount (negative: down). Later layers and your whole reply see it.
    You read layer by layer, and the program runs with you: reads and writes must go in layer order.
    Write top-level code: no functions, no imports. Ordinary Python: variables, if, for, lists.
    A name is one of the read instruction names above, as a string. Example:
        v = read("{a}", last)
        if v < 0:
            write("{a}", last, 1.0)
        write("{b}", first, -0.5)
    A few writes usually do more than many: writes add up. Keep the program short.
    {kept}
    Reply with only the code, in one ```python block.
  kept: |-

    A program that was kept on an earlier task (it helped there):
    ```python
    {code}
    ```
  retrace: |-
    Your program ran while you read the prompt. Here is its trace:
    {trace}

    Write the program again, changed as the trace suggests. Reply with only the code, in one
    ```python block.
  retry: |-
    You then attempted the task with your program, and the attempt {result}. Here is the program's
    trace again:
    {trace}

    Edit the program so that your next attempt succeeds. Reply with only the code, in one
    ```python block.

control:                     # the step 0 control experiment (eval/control.py)
  problems: 3                # fixed Valid problems (task.seed)
  layers: [0, 6, 12, 18, 24, 30]   # write layers; a write after the last layer changes only one token
  tokens: 8                  # lens tokens per difference and layer
  vocab_reply: 32            # step 0 samples its own reply (another seed) of this many tokens; 0: no vocabulary
  vocab_top: 20              # its top tokens per position form the vocabulary the lens tokens come from
  push: 0.05                 # first guess at the push size, times the norm of the state at the last token
  target: 0.1                # the push size at each layer is set so that a random direction gives this |e|^2
  calibrate: 4               # random directions per layer for setting the push size
  saturated: 4.0             # |e|^2 above this: the push replaces the reply (the maximum is 8)
  reply: 64                  # plain reply tokens the effects are read over
  top: 64                    # plain top tokens per reply position (plus one bucket for the rest)
  noise: 1.0                 # the noise in the empowerment score
  temperature: 0.6
  pool: 16                   # random directions per layer in the fixed metric (the floor draws from them)
  show: 12                   # candidates shown per problem
