# Settings. A frozen model fills in sudoku cells while a program (programs/lang.py) reads and writes
# words inside it; a writer builds the program step by step (loop.py).

models:
  qwen3-0.6b:    Qwen/Qwen3-0.6B                # steered (for now)
  qwen3-8b-4bit: mlx-community/Qwen3-8B-4bit    # writer, runs on MLX
model: qwen3-0.6b            # the model that is steered and scored

words:                       # answer words (words/answer.py): directions at the answer position, no labels
  boards: 1024               # boards Qwen reads to find candidates
  jac_boards: 512            # new boards for each candidate's effect on the answer (9 backward passes each)
  check_boards: 128          # new boards to check each chosen word against random directions
  blanks: [1, 20]            # empty cells per board
  pool_eigen: 12             # candidates per place and layer: directions where board differences move the answer
  pool_pcs: 12               # candidates per place and layer: directions where boards differ most
  primitives: 8              # words chosen
  noise: 0.1                 # as a fraction of the strongest word's effect; smaller pushes harder for variety
  max_overlap: 0.5           # skip a word whose effect over boards has |cosine| above this with a chosen word
  max_direct: 3              # at most this many words that act mostly straight on the output
  controls_per_place: 2      # random directions checked the same way
  seed: 777

reads:                       # board words (words/board.py): directions at the row, column and box line ends, no labels
  boards: 2048               # boards Qwen reads to find them
  describe_boards: 256       # new boards to describe them
  blanks: [1, 2]
  components: 32             # independent components per line end and layer
  layers: [0]
  seed: 991

boards:                      # the task
  practice: 96               # the writer's practice boards
  test: 64                   # held out until the check
  blanks: [1, 2]             # empty cells per board
  seed: 0
  dir: boards

write:                       # the writing loop (loop.py)
  writer: null               # null: the steered model writes; or a name under models, or "files"
  sessions: 8                # writing sessions side by side
  steps: 16                  # replies per session
  actions: 1                 # actions allowed per reply (then DONE)
  cells: 96                  # practice cells each action is scored on (one pass each)
  show_words: 999            # board words shown to each session (a random subset if fewer than all)
  temperature: 1.0
  repetition_penalty: 1.15
  seed: 0

agent:                       # the tool-calling writer (agent.py)
  writer: qwen3-8b-4bit
  calls: 30                  # the writer's replies, each with tool calls
  cells: 96                  # practice cells each run is scored on
  temperature: 0.6
  think_tokens: 1500         # thinking budget per reply; then the thinking is closed
  answer_tokens: 1500        # for the tool call after the thinking
  seed: 0

prompts:                     # every text a writer sees; {name} fields are filled in by the code
  loop:                      # the writing loop (loop.py)
    system: |
      You write a small Python program that runs inside a language model, the same kind of
      model as you, while it fills in one empty cell of a sudoku board. The model reads the board's
      rows, columns and boxes, one line each, and then names the digit for the cell.

      Your program reads and changes a few numbers inside the model, called words. On each board a
      word has a value: 0 is typical, +1 or -1 is unusual.
        row_end[i], col_end[i], box_end[i]: at the end of the cell's row, column and box line, at the
            model's first layer. They show what is in that line.
        answer[i]: where the model gives its answer, at later layers. Changing them changes the answer.
      The words, and what each one's value goes up with on real boards:
      {words}

      Statements:
        set(W, EXPR)                set word W to EXPR. EXPR is a number like 2.00, or words with
                                    factors, like 0.50 * row_end[3] - col_end[7].
        clear(W)                    set word W back to 0.
        if EXPR > X:                run the indented lines if EXPR > X on this board (X from -2 to 2),
            set(...) or clear(...)
        else:                       otherwise these (optional).
            set(...) or clear(...)
        best = argmax(W1, W2, ...)  which of these 2 to 9 words is largest on this board,
        if best == 0:               then run the lines under its number.
            set(...) or clear(...)
        elif best == 1:
            set(...) or clear(...)
      The model runs forward through its layers, and so does your program: a statement can only read
      words at the same layer as, or an earlier layer than, the words it writes. The line words come
      first, the answer words later.

      You build the program one step at a time. {per_reply}
        ADD                 add statements at the end
        <statements>
        END
        REPLACE k           replace statement number k
        <statements>
        END
        DELETE k            delete statement number k
        END
        TEST                run statements on their own, once, without changing the program
        <statements>
        END
        TEST W              see word W's average value on the practice cells
        END
      After each reply you see what each step did on the practice cells. A change that makes the
      program worse is undone. Use TEST to learn what words do, then ADD what helps.
      The goal is to get as many cells right as possible.
    one_action: "Each reply is exactly one step:"
    many_actions: "Each reply is up to {actions} steps, one after another, then a line DONE. They run in order:"
    first: |-
      The program is empty. With no program, {right} of {cells} practice cells are right.
      Take your first step.
    next: |-
      {results}

      Current program:
      {program}

      Next step.
  agent:                     # the tool-calling writer (agent.py)
    system: |
      You write a program in Python. The program runs inside another language model while that
      model fills in one empty cell of a sudoku board. The goal is a program that makes the model
      answer more cells correctly.

      The model answers with a digit from 1 to 9: it gives each digit a score and picks the
      highest. Writing to a word shifts those scores. Reading a word tells you something about
      what the model saw on this cell. A good program uses what it reads on each cell to decide
      which write to make, so that the model's answer moves to the right digit.

      The program reads and writes numbers inside the model, called words. A word's value on a cell
      is 0 when typical, and +1 or -1 when unusual. The model reads the board as 27 lines (rows,
      columns, boxes), then the target cell, then answers. The words are:
        row_end, col_end, box_end: at the end of the target cell's row, column and box line
        answer: where the model gives its answer
      {words}
      You do not know what each word means. Find out by running code.

      The program. Words look like four Python lists. The lists already exist: do not define or
      fill them; your program only uses them. Reading a word gives its value on the current
      cell. Assigning to a word moves the model's state so that the word reads that value:
          answer[2] = 3.0                          # push answer[2] to +3
          answer[1] = 0                            # back to typical
      The usual pattern is: read words to decide, then make a fixed push:
          if row_end[3] > 1.0:                     # what the model saw on this cell
              answer[5] = 3.0                      # a push that moves the answer
      You can use variables, if / elif / else, and / or / not, for loops over range() or lists,
      and best = argmax(w0, w1, ...), which gives the position (from 0) of the largest word, for
      use in if best == k. Example:
          for i in range(3):
              if row_end[i] > 1.0 and col_end[i] < 0:
                  answer[i] = -2.0
          best = argmax(box_end[4], box_end[9], col_end[11])
          if best == 0:
              answer[6] = 3.0
          elif best == 2:
              answer[1] = -3.0
      Word values are only known while the model runs, so they can be compared, added, multiplied
      or divided by numbers, and passed to argmax. Two word values cannot be multiplied, and a word
      cannot be set to a sum of words plus a number. There are no functions, while loops or imports.
      The program runs forward through the model's layers with it.{layers} A word cannot be
      written after the model has passed its layer; the trace says when that happens.

      Feedback. Every run reports the cells right against no program, how many cells it fixed and
      broke, and which digits the answers changed to. Then, for each line of the program, what it
      did on this run:
        line 2  if row_end[15] > 1.0:   true on 23 of 96 cells (values -2.10 to +3.00)
        line 3  answer[7] = 3.0         ran on 23 cells; answers changed on 19 (to 7: 19); fixed 6, broke 1
      Then example cells it fixed and broke, with their traces.

      The trace. For each cell, the trace shows what the program did, in order:
        set answer[2]: -0.61 -> +3.00              the word read -0.61 before, and +3.00 after
        if: +0.53 > 0.00 is true                   the value compared, and which branch ran
        argmax: row_end[1] +0.20, ...; best == 1   each word's value, and the branch that ran
        nothing is written, so Qwen is unchanged   the program wrote nothing on this cell

      Your workspace has two files: program.py, your program, and notes.md, for your notes. When
      you write program.py, it runs at once, and the new version is kept only if it gets more
      cells right than the kept version. Otherwise program.py goes back to the kept version. Either
      way you see the feedback. So program.py is always your best program so far: build on it.
      Your thinking is not kept between tool calls, so write what you learn in notes.md.
      Use run to try a piece of code without changing program.py.
      Keep each step short. You have many tool calls; try many small things.

      There are {cells} practice cells. With no program, the model gets {right} of them right.
      You have {calls} tool calls. At the end, program.py is checked on new boards.
      Call submit to end early.
    first: "Begin."
    no_tool: "Call a tool."
    tools:
      read_file:
        description: "Read a file in your workspace: program.py or notes.md."
        parameters:
          path: {type: string, description: "program.py or notes.md"}
        required: [path]
      write_file:
        description: >-
          Replace the whole content of program.py or notes.md. A new program.py runs at once and
          is kept only if it gets more cells right; you see its feedback either way.
        parameters:
          path: {type: string, description: "program.py or notes.md"}
          content: {type: string, description: "the new content of the file"}
        required: [path, content]
      run:
        description: >-
          Try Python code inside the model on the practice cells, without changing program.py.
          With no code, run program.py. Returns the cells right, compared with no program: how
          many cells it fixed and broke, which digits the answers changed to, what each line did,
          examples of fixed and broken cells, and some rows.
          Each row shows the model's answer, the right answer, its answer with no program, and
          the trace of what the program did on that cell.
        parameters:
          code: {type: string, description: "Python code to run; leave empty to run program.py"}
          first: {type: integer, description: "first cell row to return (default 0)"}
          count: {type: integer, description: "number of cell rows to return (default 8)"}
        required: []
      submit:
        description: "End the session. program.py is then checked on new boards."
        parameters: {}
        required: []
