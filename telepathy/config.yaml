# Settings. One model writes small programs that run inside its own forward pass while it fills
# in sudoku cells (loop.py). Programs use peek and push (model/live.py).

models:
  qwen3-8b-4bit: mlx-community/Qwen3-8B-4bit    # writes programs and is steered by them (MLX)
model: qwen3-8b-4bit

live:                        # running programs (model/live.py)
  keep: [0, 6, 12, 18, 24, 30, 35]   # layers whose plain states are saved for the practice cells (speed)

boards:                      # the task
  practice: 96               # practice boards; the practice cells come from these
  test: 64                   # held out until the check
  blanks: [1, 2]             # empty cells per board
  seed: 0
  dir: boards

loop:                        # the coding loop (loop.py)
  steps: 20                  # search or improve steps in all
  samples: 3                 # programs sampled per improve step
  restart_after: 3           # improve steps with no gain before starting from a fresh program
  cells: 32                  # practice cells each program is run on
  temperature: 0.7
  think: false               # Qwen3 thinking before each program
  max_tokens: 700            # per program
  examples: 1                # fixed and broken cells shown with their traces, of each
  show_failed: 3             # recent attempts that were not better, shown when improving
  seed: 0

prompts:                     # every text the model sees; {name} fields are filled in by the code
  base: |-
    Write a short Python program. It runs inside a language model (you) while the model reads a
    prompt and gives the next token. The goal is for the model to give the right answer more
    often. Here is one prompt the model reads; the right answer is the digit after the "=":

    {example}

    Every prompt has this form. Your program runs once per prompt, and gets:
      prompt          the prompt text
      tokens          the text of each token; positions are 0 to last
      last            the position of the last token ({last} here); the model answers there
      token_at(i)     the token position holding character i of prompt
      layers          the number of layers ({layers}); they are 0 to {layers} - 1
      peek(pos, layer, token)
          how strongly the model leans toward token (a string, like "5") at position pos after
          layer layer: a log-probability, from about -20 (not at all) to 0 (certain)
      push(pos, layer, token, amount)
          push the model's state at pos after layer toward token. amount 0.1 is a small push,
          0.5 a strong one; negative pushes away
    The model runs from layer 0 to the last layer, and your program runs with it: peeks and
    pushes must go in layer order (a peek or push at a layer the model has passed is an error).
    Write top-level code that runs as it is: do not put it in a function. Use ordinary Python:
    variables, if, for, string methods, lists. No imports.

    Example:
        eq = token_at(prompt.rindex("="))
        first_line_end = token_at(prompt.index("\n") - 1)
        if peek(first_line_end, 10, "5") > -8.0:
            push(last, 30, "5", 0.3)
  fresh: |-
    Write a program. Reply with only the code, in one ```python block.
  improve: |-
    This program gets {right} of {cells} practice prompts right (with no program: {plain}):
    ```python
    {code}
    ```
    What happened when it ran:
    {feedback}
    {failed}

    Write a different program that gets more prompts right. Keep what works; change what broke
    answers or did nothing. Reply with only the code, in one ```python block.
  failed: "These recent attempts were not better:"
  failed_one: |-
    {right} right:
    ```python
    {code}
    ```
