# Settings. A frozen model fills in sudoku cells while a program (programs/lang.py) reads and writes
# words inside it; a writer builds the program step by step (loop.py).

models:
  qwen3-0.6b:    Qwen/Qwen3-0.6B                # steered (for now)
  qwen3-8b-4bit: mlx-community/Qwen3-8B-4bit    # writer, runs on MLX
model: qwen3-0.6b            # the model that is steered and scored

words:                       # answer words (words/answer.py): directions at the answer position, no labels
  boards: 1024               # boards Qwen reads to find candidates
  jac_boards: 512            # new boards for each candidate's effect on the answer (9 backward passes each)
  check_boards: 128          # new boards to check each chosen word against random directions
  blanks: [1, 20]            # empty cells per board
  pool_eigen: 12             # candidates per place and layer: directions where board differences move the answer
  pool_pcs: 12               # candidates per place and layer: directions where boards differ most
  primitives: 8              # words chosen
  noise: 0.1                 # as a fraction of the strongest word's effect; smaller pushes harder for variety
  max_overlap: 0.5           # skip a word whose effect over boards has |cosine| above this with a chosen word
  max_direct: 3              # at most this many words that act mostly straight on the output
  controls_per_place: 2      # random directions checked the same way
  seed: 777

reads:                       # board words (words/board.py): directions at the row, column and box line ends, no labels
  boards: 2048               # boards Qwen reads to find them
  describe_boards: 256       # new boards to describe them
  blanks: [1, 2]
  components: 32             # independent components per line end and layer
  layers: [0]
  seed: 991

boards:                      # the task
  practice: 96               # the writer's practice boards
  test: 64                   # held out until the check
  blanks: [1, 2]             # empty cells per board
  seed: 0
  dir: boards

write:                       # the writing loop (loop.py)
  writer: null               # null: the steered model writes; or a name under models, or "files"
  sessions: 8                # writing sessions side by side
  steps: 16                  # replies per session
  actions: 1                 # actions allowed per reply (then DONE)
  cells: 96                  # practice cells each action is scored on (one pass each)
  show_words: 999            # board words shown to each session (a random subset if fewer than all)
  temperature: 1.0
  repetition_penalty: 1.15
  seed: 0

agent:                       # the tool-calling writer (agent.py)
  writer: qwen3-8b-4bit
  calls: 40                  # the writer's replies, each with tool calls
  cells: 96                  # practice cells each run is scored on
  temperature: 0.6
  max_tokens: 6000           # per reply, thinking included
  seed: 0

prompts:                     # every text a writer sees; {name} fields are filled in by the code
  loop:                      # the writing loop (loop.py)
    system: |
      You write a small Python program that runs inside a language model, the same kind of
      model as you, while it fills in one empty cell of a sudoku board. The model reads the board's
      rows, columns and boxes, one line each, and then names the digit for the cell.

      Your program reads and changes a few numbers inside the model, called words. On each board a
      word has a value: 0 is typical, +1 or -1 is unusual.
        row_end[i], col_end[i], box_end[i]: at the end of the cell's row, column and box line, at the
            model's first layer. They show what is in that line.
        answer[i]: where the model gives its answer, at later layers. Changing them changes the answer.
      The words, and what each one's value goes up with on real boards:
      {words}

      Statements:
        set(W, EXPR)                set word W to EXPR. EXPR is a number like 2.00, or words with
                                    factors, like 0.50 * row_end[3] - col_end[7].
        clear(W)                    set word W back to 0.
        if EXPR > X:                run the indented lines if EXPR > X on this board (X from -2 to 2),
            set(...) or clear(...)
        else:                       otherwise these (optional).
            set(...) or clear(...)
        best = argmax(W1, W2, ...)  which of these 2 to 9 words is largest on this board,
        if best == 0:               then run the lines under its number.
            set(...) or clear(...)
        elif best == 1:
            set(...) or clear(...)
      The model runs forward through its layers, and so does your program: a statement can only read
      words at the same layer as, or an earlier layer than, the words it writes. The line words come
      first, the answer words later.

      You build the program one step at a time. {per_reply}
        ADD                 add statements at the end
        <statements>
        END
        REPLACE k           replace statement number k
        <statements>
        END
        DELETE k            delete statement number k
        END
        TEST                run statements on their own, once, without changing the program
        <statements>
        END
        TEST W              see word W's average value on the practice cells
        END
      After each reply you see what each step did on the practice cells. A change that makes the
      program worse is undone. Use TEST to learn what words do, then ADD what helps.
      The goal is to get as many cells right as possible.
    one_action: "Each reply is exactly one step:"
    many_actions: "Each reply is up to {actions} steps, one after another, then a line DONE. They run in order:"
    first: |-
      The program is empty. With no program, {right} of {cells} practice cells are right.
      Take your first step.
    next: |-
      {results}

      Current program:
      {program}

      Next step.
  agent:                     # the tool-calling writer (agent.py)
    system: |
      You write a small program in a Python-like language. The program runs inside another
      language model while that model fills in one empty cell of a sudoku board. The goal is a program
      that makes the model answer more cells correctly.

      The program reads and writes numbers inside the model, called words. A word's value on a board is
      0 when typical, and +1 or -1 when unusual. The words are:
      {words}
      The model reads the board as 27 lines (rows, columns, boxes), then the target cell, then answers.
      row_end, col_end and box_end words sit at the end of the target cell's row, column and box line.
      answer words sit where the model gives its answer.
      You do not know what each word means. Find out with the run tool.

      The language. A program is a list of statements. They run in order, once per cell.
        set(W, EXPR)      Move the model's state so that word W reads EXPR on this cell.
                          Later statements that read W see the new value.
        clear(W)          The same as set(W, 0.00).
      EXPR is either a number from -8.00 to 8.00, or a sum of words, each with an optional factor
      (any nonzero number up to 64): row_end[3], 2.00 * col_end[7] - 0.50 * box_end[1].
      Inside a program, a word in an EXPR means that word's value on the current cell.

        if EXPR > X:      X is a number from -2.00 to 2.00. On cells where EXPR > X the lines
            LINES         under "if" run; on the others the lines under "else" run.
        else:             The else part is optional.
            LINES

        best = argmax(W0, W1, ...)   2 to 9 different words. best is the position (counting from
        if best == 0:                0) of the word with the largest value on this cell. Only the
            LINES                    lines under the matching number run. A number with no lines
        elif best == 1:              does nothing. Every "if best == k" must come right after its
            LINES                    argmax line.

      LINES are one or more set(...) or clear(...) lines indented by 4 spaces. An if or argmax
      cannot be nested inside another. There are no other statements, variables or comments.

      Example (the word numbers here are arbitrary):
        set(answer[3], 2.00)
        if row_end[5] - 0.50 * col_end[2] > 1.00:
            set(answer[0], -1.50)
        else:
            clear(answer[0])
        best = argmax(box_end[4], box_end[9], col_end[11])
        if best == 0:
            set(answer[6], 3.00)
        elif best == 2:
            set(answer[1], -3.00)
            set(answer[2], 1.00)

      Layers. The program runs forward through the model's layers with it: a statement can only
      read words at the same layer as, or an earlier layer than, the words it writes. A statement
      that breaks this is skipped, and the trace says so.{layers}

      The trace. For each cell, run shows what each statement did, in order:
        set answer[2]: -0.61 -> +3.00              the word read -0.61 before, and +3.00 after
        if: +0.53 > 0.00 is true                   the value of EXPR, and which branch ran
        argmax: row_end[1] +0.20, ...; best == 1   each word's value, and the branch that ran
        nothing is written, so Qwen is unchanged   the program wrote nothing on this cell

      Work like an experimenter. First learn what single words do: run one statement at a time,
      for example one word set to a large positive or negative value, and compare the rows with
      the empty program. Then build a program from what you learned, run it, and improve it.

      There are {cells} practice cells. With no program, the model gets {right} of them right.
      You have {calls} tool calls. Call submit with your best program before they run out.
    first: "Begin."
    no_tool: "Call a tool: run or submit."
    run: >-
      Run statements inside the model on the practice cells. Returns how many cells are right,
      then one row per cell: the model's answer, the right answer, and the trace of what each
      statement did on that cell. An empty code runs the model with no program.
    run_code: "statements, one per line"
    run_first: "first cell row to return (default 0)"
    run_count: "number of cell rows to return (default 24)"
    submit: "Submit the final program. It is checked on held-out boards. This ends the session."
    submit_code: "statements, one per line"
